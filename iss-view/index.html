<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="description" content="Take a ride on the International Space Station with the Esri ArcGIS API for JavaScript.">

  <title>Take a ride on the ISS</title>
  <link rel="icon" href="favicon.ico" type="image/x-icon">

  <link rel="stylesheet" href="https://js.arcgis.com/4.16/esri/css/main.css">
  <style>
    body {
      font-family: "Avenir Next", "Helvetica Neue", Helvetica, Arial, sans-serif;
    }

    html,
    body,
    .esri-view {
      padding: 0;
      margin: 0;
      height: 100%;
      background-color: #000;
    }

    #viewNode {
      pointer-events: none;
    }

    .off {
      display: none;
    }

    .credits {
      display: none;
      padding: 5px;
      line-height: 1.5em;
      background-color: rgba(255, 255, 255, 0.65);
    }

    .credits a {
      color: #323232;
      margin: 0 7px;
      font-size: 1.15em;
      font-weight: bold;
    }

    .credits .iss,
    .credits .iss a {
      margin: 0;
      font-size: 1.0em;
      font-weight: normal;
      text-align: center;
    }

    #fallbackBg {
      display: none;
      position: absolute;
      inset: 0;
      background: url('./solar-terminator.gif') center / cover no-repeat;
      z-index: 1;
    }

    .info-message {
      display: none;
      flex-direction: column;
      align-items: center;
      position: absolute;
      top: 30%;
      left: 10%;
      right: 10%;
      color: #de2900;
      font-size: 1.5em;
      font-weight: bold;
      cursor: default;
      text-shadow: 0 1px 6px rgba(0, 0, 0, 0.8);
      z-index: 2;
    }

    #locatorMapNode {
      width: 180px;
      height: 180px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      overflow: hidden;
      z-index: 1;
      opacity: 0;
      transition: opacity 1s ease-in;
    }

    #issLocatorIcon {
      position: absolute;
      width: 44px;
      height: 44px;
      margin-left: -22px;
      margin-top: -22px;
      pointer-events: none;
      filter: brightness(500%);
      transform-origin: center;
      display: none;
      z-index: 2;
    }

    #issLocatorArrow {
      position: absolute;
      margin-left: -5px;
      margin-top: -11px;
      pointer-events: none;
      transform-origin: center;
      display: none;
      z-index: 2;
    }

    /* slightly smaller basemap toggle */
    .esri-basemap-toggle {
      height: 55px;
      width: 50px;
    }

    .esri-basemap-toggle__container,
    .esri-basemap-toggle__image {
      height: 50px;
      width: 50px;
    }

    @keyframes rotate-station-icon {
      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }
    }
  </style>

</head>

<body>
  <div id="viewNode">
    <div id="fallbackBg"></div>
    <div id="creditsNode" class="esri-widget esri-component credits">
      <div>
        <a target="_blank" href="https://twitter.com/JWasilGeo">@JWasilGeo</a>
        |
        <a target="_blank" href="https://github.com/jwasilgeo/esri-experiments/tree/master/iss-view" style="margin-right: 5px;">Github</a>
        <div class="iss">
          ISS location © <a href="https://wheretheiss.at/w/developer" target="_blank">Where The ISS At?</a>
        </div>
      </div>
    </div>

    <div id="locatorMapNode">
      <img id="issLocatorIcon" src="./favicon.ico" alt="ISS location">
      <svg id="issLocatorArrow" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 10 22" width="10" height="22">
        <line x1="5" y1="22" x2="5" y2="8" stroke="white" stroke-width="1.5" stroke-opacity="0.9"/>
        <polygon points="5,0 9,10 5,7 1,10" fill="white" fill-opacity="0.9"/>
      </svg>
    </div>

    <div id="infoMessageNode" class="info-message"></div>
  </div>

  <script src="https://js.arcgis.com/4.16/"></script>
  <script src="https://unpkg.com/geodesy@1.1.3/latlon-spherical"></script>
  <script src="script.js"></script>
</body>

</html>
